<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Silent Heist — The Meridian Museum</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        --ink: #05070c;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ink);
        font-family: "Helvetica Neue", "Segoe UI", Arial, sans-serif;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      canvas {
        display: block;
        background: var(--ink);
        cursor: crosshair;
        image-rendering: auto;
        outline: none;
      }
      /* The page tells you what it needs before the canvas has painted once. */
      #hint {
        position: fixed;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        color: #6d7a92;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        pointer-events: none;
        transition: opacity 0.6s ease;
      }
      body.ready #hint {
        opacity: 0;
      }
      body.staged #hint {
        display: none;
      }
      noscript {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #f2e9d6;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="game" width="1280" height="720" tabindex="0" aria-label="Silent Heist, a top-down stealth heist game"></canvas>
    </div>
    <div id="hint">Click the museum, then press Enter to start the job</div>
    <noscript>Silent Heist needs JavaScript to run.</noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
